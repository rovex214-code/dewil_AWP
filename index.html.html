<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>〆⌊𝓇𝑜𝓋𝑒𝓍⌉-D̲E̲W̲İ̲L̲-A𝙒P-ツ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        @keyframes rgb-effect {
            0% { color: #ff0000; text-shadow: 0 0 20px #ff0000; }
            17% { color: #ff00ff; text-shadow: 0 0 20px #ff00ff; }
            33% { color: #0000ff; text-shadow: 0 0 20px #0000ff; }
            50% { color: #00ffff; text-shadow: 0 0 20px #00ffff; }
            67% { color: #00ff00; text-shadow: 0 0 20px #00ff00; }
            83% { color: #ffff00; text-shadow: 0 0 20px #ffff00; }
            100% { color: #ff0000; text-shadow: 0 0 20px #ff0000; }
        }

        .rgb-text {
            font-size: 5vw;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            animation: rgb-effect 5s linear infinite;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            .rgb-text {
                font-size: 6vw;
                white-space: normal;
                word-break: break-all;
            }
        }
    </style>
</head>
<body>

    <div class="rgb-text">
        /// "〆⌊𝓇𝑜𝓋𝑒𝓍⌉-D̲E̲W̲İ̲L̲-A𝙒P-ツ" \\\
    </div>

</body>
</html>
